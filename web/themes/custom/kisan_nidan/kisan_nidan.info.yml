name: Kisan Nidan
type: theme
base theme: bootstrap5
description: 'A custom Bootstrap 5 dependent theme for Kisan Nidan project.'
core_version_requirement: ^10.1 || ^11.0
package: Custom

libraries:
  - kisan_nidan/global-styling

regions:
  header: Header
  nav_branding: 'Navigation branding region'
  nav_main: 'Main navigation region'
  nav_additional: 'Additional navigation region'
  breadcrumb: Breadcrumbs
  content: 'Main content'
  sidebar_first: 'Sidebar first'
  sidebar_second: 'Sidebar second'
  footer: Footer

features:
  - logo
  - favicon
  - node_user_picture
  - comment_user_picture
  - search_box
